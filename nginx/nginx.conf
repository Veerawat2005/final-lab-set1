# ต้องมีบล็อก events ถึงแม้จะว่างเปล่า
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Rate Limiting Zones (ต้องประกาศในบล็อก http เท่านั้น) ──
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ── HTTP → HTTPS redirect ──
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ──
    server {
        listen 443 ssl;
        server_name localhost;

        # TLS certificates
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # TLS hardening
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       1d;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options           DENY;
        add_header X-Content-Type-Options    nosniff;
        add_header X-XSS-Protection          "1; mode=block";

        # ── Frontend ──
        location / {
            proxy_pass         http://frontend:80;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── Auth Service ──
        location /api/auth/login {
            limit_req zone=login_limit burst=3 nodelay;
            limit_req_status 429;
            proxy_pass         http://auth-service:3001;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        location /api/auth/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass         http://auth-service:3001;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── Task Service ──
        location /api/tasks/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://task-service:3002;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── Log Service ──
        location = /api/logs/internal {
            return 403;
        }

        location /api/logs/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass         http://log-service:3003;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # ── 429 custom response ──
        error_page 429 /429.json;
        location = /429.json {
            internal; # ป้องกันการเรียกตรงๆ
            return 429 '{"error":"Too Many Requests","retryAfter":60}';
            add_header Content-Type application/json;
        }
    }
}