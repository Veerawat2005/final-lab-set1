# ── Rate limiting zones ──────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=login_limit:10m   rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m     rate=30r/m;

# ── HTTP → HTTPS redirect ────────────────────────────────────────────
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# ── HTTPS server ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ── Frontend (static files) ────────────────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # ── Auth Service (Login) ──────────────────────
    location /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass         http://auth-service:3001; 
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Auth Service (General) ──────────────────────
    location /api/auth/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass         http://auth-service:3001; # ลบ Path ส่วนเกินออกเพื่อให้ Node.js จัดการเอง
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization $http_authorization;
        proxy_pass_header  Authorization;
    }

    # ── Task Service ───────────────────────────────────────────────
    location /api/tasks/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass         http://task-service:3002; # ส่งต่อแบบตรงๆ ไม่ต้องใส่ Path ซ้ำ
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization $http_authorization;
        proxy_pass_header  Authorization;
    }

    # ── Log Service ────────────────────────────────────────────────
    location /api/logs {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass         http://log-service:3003;
        proxy_set_header   Host $host;
        proxy_set_header   Authorization $http_authorization;
        proxy_pass_header  Authorization;
    }

    # ── Log Internal (Blocked from outside) ────────────────────────
    location = /api/logs/internal {
        return 403;
    }

    # ── 429 custom response ────────────────────────────────────────
    error_page 429 /429.json;
    location = /429.json {
        return 429 '{"error":"Too Many Requests","retryAfter":60}';
        add_header Content-Type application/json;
    }
}